schema_version: 2
upstream:
  repo: neovim/nvim-lspconfig
  sha: 77b7432d4770d23b277d37923e5a08a442d8bb07
servers:
  - id: ada_ls
    cmd:
      - ada_language_server
    filetypes:
      - ada
  - id: agda_ls
    cmd:
      - als
    filetypes:
      - agda
  - id: agentscript
    cmd:
      - agentscript-lsp
      - --stdio
    filetypes:
      - agentscript
    root_markers:
      - package.json
      - .git
  - id: aiken
    cmd:
      - aiken
      - lsp
    filetypes:
      - aiken
    root_markers:
      - aiken.toml
      - .git
  - id: air
    package: air
    cmd:
      - air
