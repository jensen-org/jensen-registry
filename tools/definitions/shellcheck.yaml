id: shellcheck
kind: linter
bin: shellcheck
args:
  - --format=json
  - "{path}"
languages:
  - shellscript
config:
  - .shellcheckrc
parser:
  kind: json
  items: $
  field:
    path: file
    line: line
    column: column
    end_line: endLine
    end_column: endColumn
    code: code
    message: message
    severity: level
  severity:
    map:
      error: 1
      warning: 2
      info: 3
      style: 4
    default: 2
package: shellcheck
priority: 0
