id: hadolint
kind: linter
bin: hadolint
args:
  - --format
  - json
  - "{path}"
languages:
  - dockerfile
config:
  - .hadolint.yaml
parser:
  kind: json
  items: $
  field:
    path: file
    line: line
    column: column
    code: code
    message: message
    severity: level
  severity:
    map:
      error: 1
      warning: 2
      info: 3
      style: 4
    default: 2
package: hadolint
priority: 0
