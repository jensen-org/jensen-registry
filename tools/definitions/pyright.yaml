id: pyright
kind: languageserver
bin: pyright-langserver
args:
  - --stdio
languages:
  - python
settings:
  python:
    analysis:
      autoSearchPaths: true
      useLibraryCodeForTypes: true
      diagnosticMode: openFilesOnly
    pythonPath: "{interpreter}"
    defaultInterpreterPath: "{interpreter}"
root_markers:
  - pyproject.toml
  - setup.py
  - setup.cfg
  - requirements.txt
package: pyright
priority: 0
