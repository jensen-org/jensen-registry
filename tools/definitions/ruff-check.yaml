id: ruff-check
kind: linter
bin: ruff
args:
  - check
  - --output-format
  - json
  - "{path}"
languages:
  - python
config:
  - ruff.toml
  - .ruff.toml
priority: 10
parser:
  kind: json
  items: $
  field:
    path: filename
    line: location.row
    column: location.column
    end_line: end_location.row
    end_column: end_location.column
    code: code
    message: message
package: ruff
