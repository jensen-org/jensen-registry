schema_version: 2
upstream:
  repo: mfussenegger/nvim-lint
  sha: f6230a5c06ba59e6059c14637f1dbe29a7978b9b
linters:
  - id: actionlint
    package: actionlint
    filetypes:
      - yaml
    cmd: actionlint
    stdin: true
    ignore_exitcode: true
    runnable: false
  - id: alex
    package: alex
    filetypes:
      - markdown
    cmd: alex
    stdin: true
    stream: stderr
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - "[\\s]*(?<line>[0-9]+):(?<column>[0-9]+)\\-(?<end_line>[0-9]+):(?<end_column>[0-9]+)[\\s]+(?<severity>[A-Za-z0-9]+)[\\s]+(?<message>.*?)[\\s]+[\\s]+(?<code>[!-~]+)[\\s]+[!-~]+"
      severity:
        warning: 2
        error: 1
      defaults:
        severity: 2
        source: alex
  - id: ameba
    cmd: bin/ameba
    args:
      - --format
      - json
    stdin: false
    append_file: true
    ignore_exitcode: true
    runnable: false
  - id: ansible_lint
    package: ansible-lint
    cmd: ansible-lint
    args:
      - -p
      - --nocolor
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - "^(?<path>.+?):(?<line>\\d+):(?<column>\\d+): (?<message>.*)$"
        - "^(?<path>.+?):(?<line>\\d+): (?<message>.*)$"
      defaults:
        source: ansible-lint
        severity: 3
  - id: bandit
    package: bandit
    filetypes:
      - python
    cmd: bandit
    args:
      - -f
      - custom
      - --msg-template
      - "{line}:{col}:{severity}:{test_id} {msg}"
    stdin: false
    stream: stdout
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - (?<line>[0-9]+):(?<column>[0-9]+):(?<severity>[A-Z]+):(?<code>[A-Za-z0-9]+) (?<message>.*)
      severity:
        HIGH: 1
        MEDIUM: 2
        LOW: 3
      defaults:
        source: bandit
  - id: bash
    cmd: bash
    args:
      - -n
      - -s
    stdin: true
    append_file: false
    stream: stderr
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - ^bash:\\\\ line\\\\ (?<line>\d+):\\\\ (?<message>.*)$
      defaults:
        source: bash
        severity: 1
  - id: bean_check
    cmd: bean-check
    stdin: false
    stream: stderr
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - "^(?<path>.+?):(?<line>\\d+): (?<message>.*)$"
      defaults:
        source: bean-check
        severity: 1
  - id: biomejs
    package: biome
    filetypes:
      - javascript
      - javascriptreact
      - json
      - jsonc
      - jsonl
      - typescript
    cmd: biome
    args:
      - lint
      - --reporter=json
      - "{file}"
    stdin: false
    stream: both
    ignore_exitcode: true
    config:
      - biome.json
      - biome.jsonc
    priority: 20
    remedies:
      - match: nested root configuration
        explain: Biome found another root configuration above this project and refused this one. Biome decides its project from the directory it runs in.
        label: Copy biome's migration command
        action:
          kind: run
          command:
            - biome
            - migrate
            - --write
      - match: unknown key
        explain: Biome does not recognise a key in this configuration, which usually means it was written for a different version.
        action:
          kind: open
          path: "{config}"
      - match: configuration resulted in errors
        explain: Biome stopped before reading the file because its configuration did not load.
        action:
          kind: open
          path: "{config}"
    parser:
      kind: json
      items: diagnostics
      field:
        path: location.path.file||location.path
        span: location.span
        code: category
        message: description||message
        line: location.start.line
        column: location.start.column
        end_line: location.end.line
        end_column: location.end.column
        severity: severity
      severity:
        map:
          error: 1
          warning: 2
          information: 3
          hint: 4
        default: 2
  - id: blocklint
    cmd: blocklint
    args:
      - --stdin
      - --end-pos
    stdin: true
    parser:
      kind: regex
      patterns:
        - "^stdin:(?<line>\\d+):(?<column>\\d+):(?<end_column>\\d+): (?<message>.*)$"
      defaults:
        source: blocklint
        severity: 3
  - id: buf_lint
    package: buf
    filetypes:
      - proto
    cmd: buf
    args:
      - lint
      - --error-format
      - json
    stdin: false
    ignore_exitcode: true
    runnable: false
  - id: buildifier
    package: buildifier
    filetypes:
      - bzl
    cmd: buildifier
    stdin: true
    append_file: false
    stream: both
    runnable: false
  - id: cfn_lint
    package: cfn-lint
    filetypes:
      - json
      - jsonc
      - jsonl
      - yaml
    cmd: cfn-lint
    args:
      - --format
      - parseable
    stdin: true
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - "[^:]+:(?<line>[0-9]+):(?<column>[0-9]+):(?<end_line>[0-9]+):(?<end_column>[0-9]+):(?<severity>[A-Za-z0-9])(?<code>[0-9]+):(?<message>.*)"
      severity:
        W: 2
        E: 1
      defaults:
        source: cfn-lint
  - id: cfn_nag
    cmd: cfn_nag_scan
    args:
      - --output-format
      - json
      - --input-path
    stdin: false
    runnable: false
  - id: checkbashisms
    cmd: checkbashisms
    args:
      - --lint
      - "-"
    stdin: true
    append_file: true
    stream: stdout
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - "^\\(stdin\\):(?<line>\\d+):1: warning: possible bashism; (?<message>.*)$"
      defaults:
        source: checkbashisms
        severity: 2
  - id: checkmake
    package: checkmake
    filetypes:
      - automake
      - make
    cmd: checkmake
    args:
      - --format='{{.LineNumber}}:{{.Rule}}:{{.Violation}}\n'
    stdin: false
    append_file: true
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - (?<line>[0-9]+):(?<code>[A-Za-z0-9]+):(?<message>.+)
      defaults:
        source: checkmake
        severity: 2
  - id: checkpatch
    args:
      - --strict
      - --terse
      - --file
    stdin: false
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - "(?<path>[^:]+):(?<line>[0-9]+): (?<severity>[A-Za-z]+): (?<message>.+)"
      severity:
        ERROR: 1
        WARNING: 2
        CHECK: 3
      defaults:
        source: checkpatch
    runnable: false
  - id: checkstyle
    package: checkstyle
    filetypes:
      - java
    cmd: checkstyle
    args:
      - -f
      - sarif
      - -c
    ignore_exitcode: true
    runnable: false
  - id: chktex
    cmd: chktex
    args:
      - -v0
      - -I0
      - -s
      - ":"
      - -f
      - "%l%b%c%b%d%b%k%b%n%b%m%b%b%b"
    stdin: true
    runnable: false
  - id: clangtidy
    cmd: clang-tidy
    args:
      - --quiet
    stdin: false
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - "(?<path>[^:]*):(?<line>[0-9]+):(?<column>[0-9]+): (?<severity>[A-Za-z0-9]+): (?<message>[^\\[]+) \\[(?<code>.*)\\]"
      severity:
        error: 1
        warning: 2
        information: 3
        hint: 4
        note: 4
      defaults:
        source: clang-tidy
    config:
      - .clang-tidy
    priority: 10
  - id: clazy
    cmd: clazy-standalone
    stdin: false
    stream: stderr
    parser:
      kind: regex
      patterns:
        - "(?<path>[^:]*):(?<line>[0-9]+):(?<column>[0-9]+): (?<severity>[A-Za-z0-9]+): (?<message>[^\\[]+) \\[\\-Wclazy\\-(?<code>.*)\\]"
      defaults:
        source: clazy
  - id: clippy
    cmd: cargo
    args:
      - clippy
      - --message-format
      - short
      - --quiet
    stdin: false
    append_file: false
    config:
      - clippy.toml
      - .clippy.toml
    priority: 10
    parser:
      kind: regex
      patterns:
        - "^(?<path>[^:\\s]+):(?<line>\\d+):(?<column>\\d+): (?<severity>error|warning)(?:\\[(?<code>[^\\]]+)\\])?: (?<message>.*)$"
      severity:
        map:
          error: 1
          warning: 2
        default: 2
  - id: clj-kondo
    package: clj-kondo
    filetypes:
      - clojure
    cmd: clj-kondo
    stdin: true
    stream: stdout
    ignore_exitcode: true
    runnable: false
  - id: cmake_lint
    package: cmakelang
    filetypes:
      - cmake
    cmd: cmake-lint
    args:
      - --suppress-decorations
    stdin: false
    stream: stdout
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - (?<path>[^:]+):(?<line>[0-9]+),?(?<column>[0-9]*):[\s]\[(?<code>(?<severity>[A-Za-z0-9])[0-9]+)\][\s](?<message>.+)
      severity:
        E: 1
        W: 2
        R: 3
        C: 4
      defaults:
        source: cmake-lint
  - id: cmakelint
    package: cmakelint
    filetypes:
      - cmake
    cmd: cmakelint
    args:
      - --quiet
    stdin: false
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - "(?<path>[^:]+):(?<line>[0-9]+): (?<message>.+) \\[(?<code>.+)\\]"
      defaults:
        source: cmakelint
        severity: 2
  - id: codespell
    package: codespell
    cmd: codespell
    args:
      - --stdin-single-line
      - "-"
    stdin: true
    ignore_exitcode: true
    runnable: false
  - id: commitlint
    package: commitlint
    cmd: commitlint
    stdin: true
    ignore_exitcode: true
    runnable: false
  - id: cppcheck
    cmd: cppcheck
    stdin: false
    stream: stderr
    parser:
      kind: regex
      patterns:
        - "(?<path>[^:]*):(?<line>[0-9]*):(?<column>[^:]*): \\[(?<code>[^\\]\\\\]*)\\] (?<severity>[^:]*): (?<message>.*)"
      severity:
        error: 1
        warning: 2
        performance: 2
        style: 3
        information: 3
      defaults:
        source: cppcheck
  - id: cpplint
    package: cpplint
    filetypes:
      - c
      - cpp
    cmd: cpplint
    stdin: false
    stream: stderr
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - "(?<path>[^:]+):(?<line>[0-9]+):  (?<message>.+)  (?<code>.+)"
      defaults:
        source: cpplint
        severity: 2
  - id: credo
    cmd: mix
    args:
      - credo
      - list
      - "{file}"
      - --read-from-stdin
      - --strict
      - --format=oneline
    stdin: true
    stream: stdout
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - \[[A-Za-z]\][\s]+(?<severity>.+)[\s]+[^:]+:(?<line>[0-9]+):?(?<column>[0-9]*)[\s]+(?<message>.*)
      severity:
        ↑: 1
        ↗: 2
        →: 3
        ↘: 4
        ↓: 4
      defaults:
        source: credo
  - id: cspell
    package: cspell
    cmd: cspell
    stdin: true
    stream: stdout
    ignore_exitcode: true
    runnable: false
  - id: cue
    package: cue
    filetypes:
      - cue
    cmd: cue
    args:
      - vet
    stdin: false
    stream: stderr
    ignore_exitcode: true
    runnable: false
  - id: curlylint
    package: curlylint
    filetypes:
      - jinja
      - liquid
      - nunjucks
      - twig
    cmd: curlylint
    args:
      - --format
      - compact
    stdin: false
    stream: stdout
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - "^(?<path>.+?):(?<line>\\d+):(?<column>\\d+): (?<message>.*)$"
      defaults:
        source: curlylint
        severity: 2
  - id: dash
    cmd: dash
    args:
      - -n
    stdin: false
    stream: stderr
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - "(?<path>.+): (?<line>[0-9]+): (?<message>.+)"
      defaults:
        source: dash
        severity: 1
  - id: dclint
    package: docker-compose-linter
    filetypes:
      - yaml.docker-compose
    cmd: dclint
    stdin: false
    append_file: true
    stream: stdout
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - ^[\s]*(?<line>[0-9]+):(?<column>[0-9]+)[\s]+(?<severity>[A-Za-z0-9]+)[\s]+(?<message>.+)[\s]+\S+$
      severity:
        error: 1
        warning: 2
      defaults:
        source: dclint
  - id: deadnix
    cmd: deadnix
    args:
      - --output-format=json
    stdin: false
    append_file: true
    ignore_exitcode: false
    runnable: false
  - id: deno
    package: deno
    filetypes:
      - javascript
      - javascriptreact
      - typescript
    cmd: deno
    args:
      - lint
      - --json
    stdin: false
    ignore_exitcode: true
    runnable: false
  - id: detekt
    package: detekt
    filetypes:
      - kotlin
    cmd: detekt
    args:
      - "-bp "
    stdin: false
    stream: stdout
    ignore_exitcode: true
    runnable: false
  - id: dialyxir
    cmd: mix
    args:
      - dialyzer
      - --format
      - github
      - --quiet-with-result
    stdin: true
    stream: stderr
    ignore_exitcode: true
    runnable: false
  - id: djlint
    package: djlint
    filetypes:
      - go
      - handlebars
      - jinja
      - mustache
      - nunjucks
      - twig
    cmd: djlint
    args:
      - --linter-output-format
      - "{line}:{code}: {message}"
      - "-"
    stdin: true
    stream: both
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - "(?<line>[0-9]+):(?<column>[0-9]+):(?<code>[A-Za-z][0-9]+): (?<message>.*)"
      defaults:
        source: djlint
        severity: 3
  - id: dmypy
    package: mypy
    filetypes:
      - python
    cmd: dmypy
    stdin: false
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - "(?<path>[^:]+):(?<line>[0-9]+):(?<column>[0-9]+):(?<end_line>[0-9]+):(?<end_column>[0-9]+): (?<severity>[A-Za-z]+): (?<message>.*) \\[(?<code>[A-Za-z][A-Za-z-]+)\\]"
      severity:
        error: 1
        warning: 2
        note: 4
      defaults:
        source: dmypy
  - id: dotenv_linter
    package: dotenv-linter
    filetypes:
      - env
    cmd: dotenv-linter
    args:
      - check
      - --quiet
    stdin: false
    stream: stdout
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - "[A-Za-z0-9]+:(?<line>[0-9]+) (?<code>[A-Za-z0-9]+): (?<message>.*)"
      defaults:
        source: dotenv_linter
        severity: 3
  - id: droast
    cmd: droast
    args:
      - --format
      - json
      - --no-roast
      - --no-fail
      - --check-ignorefile=false
    stdin: false
    append_file: true
    stream: both
    ignore_exitcode: true
    runnable: false
  - id: dxc
    cmd: dxc
    args:
      - -T
      - cs_6_5
    stdin: false
    stream: stderr
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - "[\\s]*(?<path>[^:]+):(?<line>[0-9]+):(?<column>[0-9]+): (?<severity>.+): (?<message>.+)"
      severity:
        error: 1
        warning: 2
      defaults:
        source: dxc
        severity: 2
  - id: editorconfig-checker
    package: editorconfig-checker
    cmd: editorconfig-checker
    args:
      - -no-color
    stdin: false
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - "[\\s]*(?<line>[0-9]+): (?<message>.+)"
      defaults:
        severity: 3
        source: editorconfig-checker
  - id: erb_lint
    cmd: bundle
    args:
      - exec
      - erblint
      - --format
      - compact
    stream: stdout
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - "^(?<path>.+?):(?<line>\\d+):(?<column>\\d+): (?<message>.*)$"
      defaults:
        source: erb-lint
        severity: 2
  - id: eslint
    cmd: eslint
    args:
      - --format
      - json
      - --stdin
      - --stdin-filename
      - "{file}"
    stdin: true
    stream: stdout
    ignore_exitcode: true
    config:
      - name: eslint.config.js
        executes: true
      - name: eslint.config.mjs
        executes: true
      - name: eslint.config.cjs
        executes: true
      - name: .eslintrc
        code_keys:
          - plugins
          - extends
          - parser
          - overrides
      - name: .eslintrc.js
        executes: true
      - name: .eslintrc.json
        code_keys:
          - plugins
          - extends
          - parser
          - overrides
      - name: .eslintrc.cjs
        executes: true
    priority: 10
    parser:
      kind: json
      groups: $
      items: messages
      field:
        path: $group.filePath
        line: line
        column: column
        end_line: endLine
        end_column: endColumn
        code: ruleId
        message: message
        severity: severity
      severity:
        map:
          "1": 2
          "2": 1
        default: 2
  - id: eslint_d
    package: eslint_d
    filetypes:
      - javascript
      - javascriptreact
      - typescript
    cmd: eslint_d
    args:
      - --format
      - json
      - --stdin
      - --stdin-filename
      - "{file}"
    stdin: true
    stream: stdout
    ignore_exitcode: true
    config:
      - name: eslint.config.js
        executes: true
      - name: eslint.config.mjs
        executes: true
      - name: eslint.config.cjs
        executes: true
      - name: .eslintrc
        code_keys:
          - plugins
          - extends
          - parser
          - overrides
      - name: .eslintrc.js
        executes: true
      - name: .eslintrc.json
        code_keys:
          - plugins
          - extends
          - parser
          - overrides
      - name: .eslintrc.cjs
        executes: true
    priority: 10
    parser:
      kind: json
      groups: $
      items: messages
      field:
        path: $group.filePath
        line: line
        column: column
        end_line: endLine
        end_column: endColumn
        code: ruleId
        message: message
        severity: severity
      severity:
        map:
          "1": 2
          "2": 1
        default: 2
  - id: eugene
    package: eugene
    filetypes:
      - sql
    cmd: eugene
    args:
      - lint
      - --format=json
    stdin: false
    runnable: false
  - id: fennel
    cmd: fennel
    args:
      - --globals
      - --compile
    stdin: false
    stream: stderr
    ignore_exitcode: true
    runnable: false
  - id: fieldalignment
    cmd: fieldalignment
    args:
      - -json
    stdin: false
    ignore_exitcode: true
    runnable: false
  - id: fish
    cmd: fish
    args:
      - --no-execute
    stdin: false
    stream: stderr
    ignore_exitcode: true
    runnable: false
  - id: flake8
    package: flake8
    filetypes:
      - python
    cmd: flake8
    args:
      - --format=%(path)s:%(row)d:%(col)d:%(code)s:%(text)s
      - --no-show-source
      - --stdin-display-name
      - "{file}"
      - "-"
    stdin: true
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - "[^:]+:(?<line>[0-9]+):(?<column>[0-9]+):(?<code>[A-Za-z0-9]+):(?<message>.+)"
      defaults:
        source: flake8
        severity: 2
  - id: flawfinder
    cmd: flawfinder
    args:
      - -S
      - -Q
      - -D
      - -C
      - --
    stdin: false
    stream: stdout
    parser:
      kind: regex
      patterns:
        - "^(?<path>.*):(?<line>[0-9]+):(?<column>[0-9]+): *\\[(?<severity>[0-5])\\] (?<message>.*)$"
      severity:
        "1": 2
        "2": 2
        "3": 2
        "4": 2
        "5": 2
      defaults:
        source: flawfinder
  - id: fortitude
    package: fortitude
    filetypes:
      - fortran
    cmd: fortitude
    args:
      - check
      - --output-format
      - json
    stdin: false
    append_file: true
    ignore_exitcode: true
    runnable: false
  - id: fsharplint
    cmd: dotnet-fsharplint
    args:
      - --format
      - msbuild
      - lint
    stdin: false
    append_file: true
    stream: stdout
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - ^(?<path>.+?)\(.*,.*,(?<line>\d+),(?<column>\d+)\):FSharpLint\\ (?<severity>[A-Za-z])arning (?<message>.*)$
      defaults:
        source: fsharplint
        severity: 2
  - id: gawk
    cmd: gawk
    args:
      - -f-
      - -L
    stdin: true
    stream: stderr
    ignore_exitcode: true
    runnable: false
  - id: gdlint
    package: gdtoolkit
    filetypes:
      - gdscript
    cmd: gdlint
    stdin: false
    append_file: true
    stream: stderr
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
        - (?<path>.+):(?<line>[0-9]+):[\s](?<severity>[A-Za-z]+):[\s](?<message>.*)
      severity:
        Error: 2
      defaults:
        source: gdlint
  - id: ghdl
    cmd: ghdl
    args:
      - -s
      - --std=08
    stdin: false
    stream: stderr
    ignore_exitcode: true
    parser:
      kind: regex
      patterns:
