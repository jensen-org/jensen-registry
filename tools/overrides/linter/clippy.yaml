config:
  - clippy.toml
  - .clippy.toml
priority: 10
parser:
  kind: regex
  patterns:
    - "^(?<path>[^:\\s]+):(?<line>\\d+):(?<column>\\d+): (?<severity>error|warning)(?:\\[(?<code>[^\\]]+)\\])?: (?<message>.*)$"
  severity:
    map:
      error: 1
      warning: 2
    default: 2
args:
  - clippy
  - --message-format
  - short
  - --quiet
