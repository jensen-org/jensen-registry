    version: 0.0.39.0
    languages:
      - Haskell
    categories:
      - DAP
    runs_script: true
    bin:
      ghci-dap:
        client: path
      haskell-debug-adapter:
        client: path
    artifacts:
      - targets:
          - unix
        run: |
          cabal update && cabal install haskell-dap ghci-dap haskell-debug-adapter-"$VERSION" --install-method=copy --installdir="$PWD"
        env:
          VERSION: 0.0.39.0
        staged: false
        bin:
