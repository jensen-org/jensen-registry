          haskell-debug-adapter: haskell-debug-adapter
      - targets:
          - win
        run: |
          cabal update && cabal install haskell-dap ghci-dap haskell-debug-adapter-$env:VERSION --install-method=copy --installdir="$pwd"
        env:
