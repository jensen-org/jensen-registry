id: excalidraw
description: Draw, edit and export Excalidraw flowcharts and architecture diagrams on your machine, to .excalidraw, SVG or PNG files you can embed in Markdown.
provider: yctimlin
license: MIT
advised: true
tags:
  - diagrams
serves:
  - excalidraw
transport: stdio
package:
  ecosystem: npm
  name: mcp-excalidraw-server
  bin: mcp-excalidraw-server
env:
  - name: EXCALIDRAW_EXPORT_DIR
    secret: false
    optional: true
    from: project_root
    description: The only directory the server may write exported files to, set to the open project.
  - name: PORT
    secret: false
    optional: true
    from: free_port
    description: The local port of the canvas the server starts, a free one chosen for each launch.
  - name: EXPRESS_SERVER_URL
    secret: false
    optional: true
    from: loopback_url
    description: Where the server finds its own canvas, the loopback address of that port.
