skip:
  - id: gitcommit
    reason: its generated parser needs about 12 GB of memory and 11 minutes of CPU to compile, which kills a 7 GB runner
  - id: vim
    reason: exited with 1
  - id: fortran
    reason: its wasm is 6.4 MB, above the 5 MB the repository accepts
  - id: gnuplot
    reason: its wasm is 7.7 MB, above the 5 MB the repository accepts
  - id: systemverilog
    reason: its wasm is 22.4 MB, above the 5 MB the repository accepts
