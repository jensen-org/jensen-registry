tools:
  - id: ruff-format
    kind: formatter
    bin: ruff
    args:
      - format
      - "-"
    languages:
      - python
    config:
      - ruff.toml
      - .ruff.toml
    priority: 10
    package: ruff
  - id: black
    kind: formatter
    bin: black
    args:
      - -q
      - "-"
    languages:
      - python
    package: black
  - id: gofmt
    kind: formatter
    bin: gofmt
    args: []
    languages:
      - go
  - id: goimports
    kind: formatter
    bin: goimports
    args: []
    languages:
      - go
    priority: 10
    package: goimports
  - id: rustfmt
    kind: formatter
    bin: rustfmt
    args:
      - --emit
      - stdout
      - --quiet
    languages:
      - rust
    config:
      - rustfmt.toml
      - .rustfmt.toml
  - id: clang-format
    kind: formatter
    bin: clang-format
    args:
      - --assume-filename={path}
    languages:
      - c
      - cpp
    config:
      - .clang-format
    package: clang-format
  - id: biome-format
    kind: formatter
    bin: biome
    args:
      - format
      - --stdin-file-path={path}
    languages:
      - typescript
      - typescriptreact
      - javascript
      - javascriptreact
      - json
      - jsonc
      - css
      - graphql
    config:
      - biome.json
      - biome.jsonc
    priority: 20
    package: biome
    remedies:
      - match: nested root configuration
        explain: Biome found another root configuration above this project and refused this one. Biome decides its project from the directory it runs in.
        label: Copy biome's migration command
        action:
          kind: run
          command:
            - biome
            - migrate
            - --write
      - match: unknown key
        explain: Biome does not recognise a key in this configuration, which usually means it was written for a different version.
        action:
          kind: open
          path: "{config}"
      - match: configuration resulted in errors
        explain: Biome stopped before reading the file because its configuration did not load.
        action:
          kind: open
          path: "{config}"
  - id: prettier
    kind: formatter
    bin: prettier
    args:
      - --stdin-filepath
      - "{path}"
    languages:
      - typescript
      - typescriptreact
      - javascript
      - javascriptreact
      - json
      - jsonc
      - css
      - scss
      - less
      - html
      - vue
      - markdown
      - yaml
      - graphql
    config:
      - name: .prettierrc
        code_keys:
          - plugins
      - name: .prettierrc.json
        code_keys:
          - plugins
      - name: .prettierrc.yaml
        code_keys:
          - plugins
      - name: .prettierrc.yml
        code_keys:
          - plugins
      - name: .prettierrc.js
        executes: true
      - name: prettier.config.js
        executes: true
      - name: prettier.config.mjs
        executes: true
    priority: 10
    package: prettier
  - id: taplo
    kind: formatter
    bin: taplo
    args:
      - format
      - "-"
    languages:
      - toml
    config:
      - .taplo.toml
      - taplo.toml
    package: taplo
  - id: stylua
    kind: formatter
    bin: stylua
    args:
      - "-"
    languages:
      - lua
    config:
      - stylua.toml
      - .stylua.toml
    package: stylua
  - id: shfmt
    kind: formatter
    bin: shfmt
    args:
      - -filename={path}
    languages:
      - shellscript
    config:
      - .editorconfig
    package: shfmt
  - id: ruff-check
    kind: linter
    bin: ruff
    args:
      - check
      - --output-format
      - json
      - "{path}"
    languages:
      - python
    priority: 10
    package: ruff
    config:
      - ruff.toml
      - .ruff.toml
    parser:
      kind: json
      items: $
      field:
        path: filename
        line: location.row
        column: location.column
        end_line: end_location.row
        end_column: end_location.column
        code: code
        message: message
  - id: biome-lint
    kind: linter
    bin: biome
    args:
      - lint
      - --reporter=json
      - "{path}"
    languages:
      - typescript
      - typescriptreact
      - javascript
      - javascriptreact
      - json
      - jsonc
      - css
    priority: 20
    package: biome
    config:
      - biome.json
      - biome.jsonc
    parser:
      kind: json
      items: diagnostics
      field:
        path: location.path.file||location.path
        span: location.span
        code: category
        message: description||message
        line: location.start.line
        column: location.start.column
        end_line: location.end.line
        end_column: location.end.column
        severity: severity
      severity:
        map:
          error: 1
          warning: 2
          information: 3
          hint: 4
        default: 2
    remedies:
      - match: nested root configuration
        explain: Biome found another root configuration above this project and refused this one. Biome decides its project from the directory it runs in.
        label: Copy biome's migration command
        action:
          kind: run
          command:
            - biome
            - migrate
            - --write
      - match: unknown key
        explain: Biome does not recognise a key in this configuration, which usually means it was written for a different version.
        action:
          kind: open
          path: "{config}"
      - match: configuration resulted in errors
        explain: Biome stopped before reading the file because its configuration did not load.
        action:
          kind: open
          path: "{config}"
  - id: eslint
    kind: linter
    bin: eslint
    args:
      - --format
      - json
      - "{path}"
    languages:
      - typescript
      - typescriptreact
      - javascript
      - javascriptreact
    config:
      - name: eslint.config.js
        executes: true
      - name: eslint.config.mjs
        executes: true
      - name: eslint.config.cjs
        executes: true
      - name: .eslintrc
        code_keys:
          - plugins
          - extends
          - parser
          - overrides
      - name: .eslintrc.js
        executes: true
      - name: .eslintrc.json
        code_keys:
          - plugins
          - extends
          - parser
          - overrides
      - name: .eslintrc.cjs
        executes: true
    priority: 10
    parser:
      kind: json
      groups: $
      items: messages
      field:
        path: $group.filePath
        line: line
        column: column
        end_line: endLine
        end_column: endColumn
        code: ruleId
        message: message
        severity: severity
      severity:
        map:
          "1": 2
          "2": 1
        default: 2
    package: eslint-lsp
  - id: golangci-lint
    kind: linter
    bin: golangci-lint
    args:
      - run
      - "{path}"
    languages:
      - go
    package: golangci-lint
    config:
      - .golangci.yml
      - .golangci.yaml
      - .golangci.toml
    parser:
      kind: pattern
      regex: "^(?P<path>[^:]+):(?P<line>\\d+):(?P<column>\\d+): (?P<message>.*?) \\((?P<code>[^)]+)\\)$"
  - id: shellcheck
    kind: linter
    bin: shellcheck
    args:
      - --format=json
      - "{path}"
    languages:
      - shellscript
    package: shellcheck
    config:
      - .shellcheckrc
    parser:
      kind: json
      items: $
      field:
        path: file
        line: line
        column: column
        end_line: endLine
        end_column: endColumn
        code: code
        message: message
        severity: level
      severity:
        map:
          error: 1
          warning: 2
          info: 3
          style: 4
        default: 2
  - id: stylelint
    kind: linter
    bin: stylelint
    args:
      - --formatter
      - json
      - "{path}"
    languages:
      - css
      - scss
      - less
    package: stylelint
    config:
      - name: .stylelintrc
        code_keys:
          - plugins
          - extends
          - customSyntax
          - processors
          - overrides
      - name: .stylelintrc.json
        code_keys:
          - plugins
          - extends
          - customSyntax
          - processors
          - overrides
      - name: stylelint.config.js
        executes: true
    parser:
      kind: json
      groups: $
      items: warnings
      field:
        path: $group.source
        line: line
