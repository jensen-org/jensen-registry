name: seed

on:
  workflow_dispatch:
    inputs:
      id:
        description: One grammar id to add, or empty to seed every language
        required: false
        default: ""

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tree-sitter
          key: tree-sitter-wasi-sdk-29-${{ runner.os }}
      - name: Install the wasi-sdk the tree-sitter build needs
        run: |
          dir="$HOME/.cache/tree-sitter/wasi-sdk"
          if [ ! -x "$dir/bin/clang" ]; then
            mkdir -p "$dir"
            curl -fsSL --retry 3 --retry-delay 5 "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz" | tar -xz --strip-components=1 -C "$dir"
          fi
          test -x "$dir/bin/clang"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --global --ignore-scripts=false --no-audit --no-fund tree-sitter-cli@0.26.7
      - run: node registry.mjs seed ${{ inputs.id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_REF: develop
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REGISTRY_BUMP_TOKEN }}
          base: develop
          branch: bot/seed
          delete-branch: true
          commit-message: "feat(grammars): seed the grammars"
          title: "feat(grammars): seed the grammars"
          body: |
            Added by `registry.mjs seed`. Grammars that could not build are listed under `skip` in `grammars/sources.yaml` with the reason.
            Nothing here merges on its own.
