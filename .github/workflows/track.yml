name: track

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --global --ignore-scripts=false --no-audit --no-fund tree-sitter-cli@0.26.7
      - run: node registry.mjs discover
      - run: node registry.mjs track
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REGISTRY_BUMP_TOKEN }}
          base: develop
          branch: bot/track
          delete-branch: true
          commit-message: "chore: bump tracked upstreams"
          title: "chore: bump tracked upstreams"
          body: |
            Re-pinned by `registry.mjs track`. Review the moved pins in `tools/upstreams.yaml` and the regenerated catalogs before merging.
            Nothing here merges on its own.
