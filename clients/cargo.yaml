id: cargo
kind: package-manager
source: cargo
requires:
  program: cargo
  probe: [cargo, --version]
hosts:
  - crates.io
  - index.crates.io
  - static.crates.io
bin_root:
  unix: bin
  windows: bin
install:
  - when: qualifier.repository_url
    run: [cargo, install, --root, "{dir}", --locked, --git, "{qualifier.repository_url}", --tag, "{version}", "{coordinate}"]
  - unless: qualifier.repository_url
    run: [cargo, install, --root, "{dir}", --locked, --version, "{version}", "{coordinate}"]
