id: opencode
label: OpenCode
tier: 1
program: opencode
docs:
  - https://opencode.ai/docs/cli
config_dir: .config/opencode
acp_registry: opencode-v2
acp:
  program: opencode
  args:
    - acp
  env:
    OPENCODE_DISABLE_AUTOUPDATE: "1"
    OPENCODE_DISABLE_LSP_DOWNLOAD: "1"
  ready:
    args:
      - acp
      - --help
    contains: Agent Client Protocol
  login:
    - auth
    - login
  install:
    label: Install OpenCode
    commands:
      - curl -fsSL https://opencode.ai/install | bash
      - npm install -g opencode-ai
    docs_url: https://opencode.ai/docs
mcp:
  via: session
skills:
  mode: agents
launch:
  writable_root_flag: --add-dir
  print_args:
    - run
  prompt_flag: --prompt
  document:
    variable: OPENCODE_CONFIG_CONTENT
    document: '{"agent":{"ask":{"description":"Ask before editing files or running commands","mode":"primary","permission":{"edit":"ask","bash":"ask"}}}}'
