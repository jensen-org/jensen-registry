id: copilot
label: Copilot CLI
tier: 1
program: copilot
docs:
  - https://docs.github.com/en/copilot/reference/copilot-cli-reference/acp-server
config_dir: .copilot
acp:
  program: copilot
  args:
    - --acp
  install:
    label: Install Copilot CLI
    commands:
      - npm install -g @github/copilot
    docs_url: https://docs.github.com/en/copilot/how-tos/set-up/install-copilot-cli
mcp:
  via: session
skills:
  mode: none
launch:
  print_args:
    - -p
assets:
  skills:
    - scope: project
      dir: .agents/skills
      origin: agents
      native: false
    - scope: user
      dir: .agents/skills
      origin: agents
      native: false
  mcp:
    - scope: project
      path: .mcp.json
      shape: mcp_servers
      origin: mcp
      native: false
  guidance:
    - AGENTS.md
